name: CI

on:
  push:
    branches: [main, "cleanup-*"]
  pull_request:

jobs:
  build-and-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      # The Makefile hardcodes CC=clang and the SIMD *_vectorized path is
      # #ifdef __clang__ with no gcc fallback, so clang must be present and CC
      # must NOT be overridden to gcc. clang is preinstalled on both runners;
      # make it explicit on ubuntu.
      - name: Ensure clang (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Compiler version
        run: clang --version

      # Builds with the portable baseline (no -march=native).
      - name: Build libraries
        run: make clean && make

      - name: C test suites (must pass)
        run: make test-v2 test-comprehensive test-stress test-golden

      - name: Amalgamation compiles standalone
        run: clang -std=c11 -DRISTRETTO_EMBEDDED -Wall -Wextra -c -o /tmp/ristretto_amalg.o embed/ristretto.c

      - name: Build dynamic library
        run: |
          make dynamic
          test -f lib/libristretto.so || { echo "::error::lib/libristretto.so not produced"; exit 1; }

      - name: C examples (6 examples + 2 amalgamation smoke tests link + run)
        run: |
          make static
          ./scripts/build_examples.sh

      - name: Go binding (build + test)
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Go build & test
        run: |
          make static
          cd examples/go
          go build ./...
          go test -count=1 ./ristretto

      - name: Python binding smoke
        run: |
          make dynamic
          python3 examples/python/example.py

      - name: Node binding setup
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Node binding smoke
        run: |
          make dynamic
          cd examples/nodejs
          npm install
          node example.js

      # NOTE: benchmark/ is not built here. The V2 benchmark builds without
      # sqlite3 (the SQLite contrast is opt-in via WITH_SQLITE=1), and the
      # benchmark Makefile keeps the portable baseline (no -march=native).

  # Memory-safety job. Runs on ubuntu-latest because macOS LeakSanitizer is
  # unsupported ("detect_leaks is not supported on this platform"), so only
  # Linux gives real leak coverage. Portable baseline flags, no -march=native.
  asan-ubsan:
    name: ASan + UBSan (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Build + run V2 suites under ASan/UBSan
        run: |
          set -e
          SAN="-std=c11 -D_DEFAULT_SOURCE -Iinclude -Iembed -I. -fsanitize=address,undefined -fno-sanitize-recover=all -g"
          SRC="src/table_v2.c src/ristretto_api.c src/version.c"
          for t in table_v2 comprehensive stress golden_format; do
            echo "=== $t ==="
            clang $SAN -o "san_$t" $SRC "tests/test_$t.c"
            ./"san_$t"
          done
      - name: Amalgamation under ASan/UBSan
        run: |
          set -e
          SAN="-std=c11 -D_DEFAULT_SOURCE -Iinclude -Iembed -I. -fsanitize=address,undefined -fno-sanitize-recover=all -g"
          clang $SAN -DRISTRETTO_EMBEDDED -c embed/ristretto.c -o ristretto_amalg_san.o
          clang $SAN -o san_embedded embed/test_embedded.c ristretto_amalg_san.o
          ./san_embedded

  # Fuzz smoke over the schema parser. ubuntu-latest only: Apple clang ships no
  # libFuzzer runtime, so this cannot run on the macOS runner or locally on
  # arm64. Portable baseline, no -march=native.
  fuzz-schema:
    name: Fuzz schema parser (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Build + run libFuzzer smoke
        run: |
          set -e
          clang -std=c11 -D_DEFAULT_SOURCE -Iinclude \
            -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=all -g \
            tests/fuzz_parse_schema.c src/table_v2.c -o fuzz_parse_schema
          ./fuzz_parse_schema -runs=100000 -max_total_time=30
